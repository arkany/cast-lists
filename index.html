function unb(s){var b=atob(s),u=new Uint8Array(b.length);for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u}
async function open(pw){
  var base=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
  var key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:unb(BLOB.s),iterations:BLOB.n,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["decrypt"]);
  var pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:unb(BLOB.i)},key,unb(BLOB.c));
  var html=new TextDecoder().decode(pt);
  document.open();document.write(html);document.close();
}
function attempt(pw,quiet){return open(pw).then(function(){try{localStorage.setItem("cast-pw",pw)}catch(e){}}).catch(function(){if(!quiet)document.getElementById("err").textContent="That isn't the password.";try{localStorage.removeItem("cast-pw")}catch(e){}})}
document.getElementById("gate").addEventListener("submit",function(e){e.preventDefault();attempt(document.getElementById("pw").value.trim())});
var h=decodeURIComponent((location.hash||"").slice(1)),saved=null;try{saved=localStorage.getItem("cast-pw")}catch(e){}
if(h){history.replaceState(null,"",location.pathname+location.search);attempt(h,true)}else if(saved){attempt(saved,true)}
