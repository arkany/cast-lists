<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" media="(prefers-color-scheme: light)" content="#f7f3ec"><meta name="theme-color" media="(prefers-color-scheme: dark)" content="#1b1917"><meta name="color-scheme" content="light dark"><meta name="robots" content="noindex,nofollow"><title>Theatre cast lists</title>
<style>:root{--bg:#f7f3ec;--fg:#1f1d1a;--muted:#6d665b;--line:#d8d0c2;--accent:#8a2a1f}@media (prefers-color-scheme:dark){:root{--bg:#1b1917;--fg:#ece6da;--muted:#a39b8d;--line:#3a3631;--accent:#e0907f}}
html{-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;min-height:100dvh;display:grid;grid-template-columns:minmax(0,1fr);place-items:center;background:var(--bg);color:var(--fg);font:17px/1.5 "Baskerville",Georgia,serif}
form.gate{width:min(360px,calc(100% - 32px));margin:0 auto}h1{font:400 36px/1.1 "Didot","Bodoni 72",Georgia,serif;margin:0 0 8px}p{color:var(--muted);margin:0 0 16px}
input{width:100%;font:inherit;font-size:16px;padding:10px;border:1px solid var(--line);border-radius:3px;background:transparent;color:var(--fg)}
button{margin-top:10px;width:100%;font:600 15px "Gill Sans",system-ui,sans-serif;letter-spacing:.06em;background:var(--accent);color:#fff;border:0;border-radius:3px;padding:10px 18px;cursor:pointer;touch-action:manipulation;user-select:none;-webkit-user-select:none;transition:transform 100ms ease-out}
button:active:not([disabled]){transform:scale(.97)}
#err{color:var(--accent);min-height:1.5em;margin:8px 0 0;font:14px "Gill Sans",system-ui,sans-serif}</style></head><body>

function unb(s){var b=atob(s),u=new Uint8Array(b.length);for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u}
async function open(pw){
  var base=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
  var key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:unb(BLOB.s),iterations:BLOB.n,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["decrypt"]);
  var pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:unb(BLOB.i)},key,unb(BLOB.c));
  var html=new TextDecoder().decode(pt);
  document.open();document.write(html);document.close();
}
var pwEl=document.getElementById("pw"),nmEl=document.getElementById("nm"),errEl=document.getElementById("err");
function showPw(){pwEl.style.display=""}
function attempt(pw,quiet){return open(pw).then(function(){try{localStorage.setItem("cast-pw",pw)}catch(e){}}).catch(function(){showPw();if(!quiet)errEl.textContent="That isn't the password.";try{localStorage.removeItem("cast-pw")}catch(e){}})}
document.getElementById("gate").addEventListener("submit",function(e){
  e.preventDefault();
  var name=nmEl.value.replace(/\s+/g," ").trim();
  if(!name){errEl.textContent="Please add your name, so I know who the answers are from.";nmEl.focus();return}
  try{localStorage.setItem("cast-name",name)}catch(x){}
  attempt(pwEl.value.trim());
});
var h=decodeURIComponent((location.hash||"").slice(1)),saved=null,nm=null;try{saved=localStorage.getItem("cast-pw");nm=localStorage.getItem("cast-name")}catch(e){}
var known=h||saved;
if(h)history.replaceState(null,"",location.pathname+location.search);
if(known&&nm){attempt(known,true)}
else if(known){pwEl.value=known;pwEl.style.display="none";document.getElementById("lead").textContent="Almost there. What's your name?";nmEl.focus()}
else{nmEl.focus()}
